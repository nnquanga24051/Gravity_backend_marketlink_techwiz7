server {
    listen 80;
    server_name _; # Hoặc điền domain của bạn: api.marketlink.vn

    # Giới hạn dung lượng tải file lên (tối đa 25MB)
    client_max_body_size 25M;

    # phpMyAdmin giao diện Web quản lý MySQL
    location /phpmyadmin {
        root /var/www;
        index index.php index.html index.htm;
        location ~ ^/phpmyadmin/(.+\.php)$ {
            try_files $uri =404;
            root /var/www;
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
        location ~* ^/phpmyadmin/(.+\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt))$ {
            root /var/www;
        }
    }

    # Nginx trực tiếp phục vụ các tệp ảnh tĩnh đã upload (Zero-Copy cực nhanh)
    location /uploads/ {
        alias /var/www/marketlink/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Serve React Frontend
    location / {
        root /var/www/marketlink/frontend;
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp các yêu cầu API sang Spring Boot Backend
    location ~ ^/(api|swagger-ui|v3)/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ Real-time SSE cho AI Assistant Chatbot không bị ngắt kết nối
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
