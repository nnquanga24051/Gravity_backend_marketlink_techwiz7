# ===================================================================
# SERVER & APPLICATION CONFIGURATION (12-Factor Ready)
# ===================================================================
# Auto-import local .env file if it exists (optional)
spring.config.import=optional:file:.env[.properties]
spring.application.name=marketlink
server.port=${PORT:8081}
server.address=0.0.0.0

# ===================================================================
# REACTIVE DATABASE CONFIGURATION (R2DBC MySQL)
# ===================================================================
# R2DBC connection URL; defaults to local marketlink_db on port 3306
spring.r2dbc.url=${DB_URL:r2dbc:mysql://localhost:3306/marketlink_db}
spring.r2dbc.username=${DB_USERNAME:root}
spring.r2dbc.password=${DB_PASSWORD:}

# R2DBC Connection Pool configuration (Optimized for high reactive throughput)
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=30
spring.r2dbc.pool.max-idle-time=30m

# SQL Initialization mode (defaults to "never" to preserve existing data)
spring.sql.init.mode=${SQL_INIT_MODE:never}

# ===================================================================
# SECURITY & JWT CONFIGURATION
# ===================================================================
# Secret key >= 32 bytes for HMAC-SHA256, prioritized from environment variable JWT_SECRET
security.jwt.secret=${JWT_SECRET:quang_dev_backend_techwiz_susc_2026_super_secure_key}
security.jwt.issuer=${JWT_ISSUER:http://localhost:8081}
# Access Token expiration time (30 minutes = 1800000 ms)
security.jwt.expiration-ms=${JWT_EXPIRATION:1800000}
# Refresh Token expiration time (7 days = 604800000 ms)
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.root=INFO
logging.level.com.gravity.marketlink=DEBUG
logging.level.org.springframework.r2dbc=DEBUG

# ===================================================================
# API DOCUMENTATION & SWAGGER UI (SpringDoc OpenAPI 3)
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ===================================================================
# AI CHATBOT ASSISTANT CONFIGURATION (Google Gemini API / LLM)
# ===================================================================
# Google Gemini API Key, prioritized from GEMINI_API_KEY environment variable
ai.gemini.api-key=${GEMINI_API_KEY:}
# Gemini Model: gemini-3.6-flash (verified active on Gemini API)
ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
# Gemini API URL endpoint
ai.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

# ===================================================================
# FILE & IMAGE UPLOAD CONFIGURATION (Unlimited upload size)
# ===================================================================
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8081}
spring.codec.max-in-memory-size=-1
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# ===================================================================
# EMAIL SERVICE CONFIGURATION (JavaMailSender / SMTP)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:nnquanga24051@cusc.ctu.edu.vn}
spring.mail.password=${SPRING_MAIL_PASSWORD:zzhklxfgtdtfmkhh}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8