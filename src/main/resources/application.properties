# ===================================================================
# CẤU HÌNH TẢI LÊN TẬP TIN & ẢNH (File & Image Upload)
# ===================================================================
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8081}
spring.codec.max-in-memory-size=15MB

