# ===================================================================
# ỨNG DỤNG & CỔNG CHẠY (Server & Application - 12-Factor Ready)
# ===================================================================
spring.application.name=marketlink
server.port=${PORT:8081}
server.address=0.0.0.0

# ===================================================================
# CẤU HÌNH DATABASE REACTIVE (R2DBC MySQL)
# ===================================================================
# URL kết nối R2DBC; ưu tiên biến môi trường DB_URL, mặc định local marketlink_db trên XAMPP port 3306
spring.r2dbc.url=${DB_URL:r2dbc:mysql://localhost:3306/marketlink_db}
spring.r2dbc.username=${DB_USERNAME:root}
spring.r2dbc.password=${DB_PASSWORD:}

# Cấu hình Connection Pool cho R2DBC (Tối ưu cho Reactive throughput cao)
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=30
spring.r2dbc.pool.max-idle-time=30m

# Khởi tạo SQL (mặc định "never" để bảo toàn dữ liệu thực tế trong MySQL)
spring.sql.init.mode=${SQL_INIT_MODE:never}

# ===================================================================
# BẢO MẬT & JWT (Security & JWT)
# ===================================================================
# Secret key dài >= 32 byte cho HMAC-SHA256, ưu tiên biến môi trường JWT_SECRET
security.jwt.secret=${JWT_SECRET:quang_dev_backend_techwiz_susc_2026}
security.jwt.issuer=${JWT_ISSUER:http://localhost:8081}
# Thời gian hết hạn của token JWT (tính bằng mili giây), mặc định 1 ngày
security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ===================================================================
# NHẬT KÝ (Logging)
# ===================================================================
logging.level.root=INFO
logging.level.com.gravity.marketlink=DEBUG
logging.level.org.springframework.r2dbc=DEBUG